name: Reusable Build

on:
  workflow_call:
    inputs:
      release:
        description: Package and upload release artifacts
        type: boolean
        default: false

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    name: Build x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        if: inputs.release
        shell: pwsh
        run: |
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/zoomify.exe, LICENSE, README.md `
            -DestinationPath zoomify-windows-amd64.zip
          (Get-FileHash zoomify-windows-amd64.zip -Algorithm SHA256).Hash | `
            Out-File -FilePath zoomify-windows-amd64.zip.sha256

      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: zoomify-windows-amd64
          path: |
            *.zip
            *.sha256
